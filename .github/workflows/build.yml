name: build

on:
  push:
    branches: [master]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: ждать устаревший смысла нет.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      # Демо это часть сдачи лабы, поэтому оно не должно сгнить незаметно.
      - name: Run the demo scenario
        run: ./gradlew run --no-daemon --console=plain

      - name: Upload the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
