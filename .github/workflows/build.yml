name: build

on:
  push:
    branches: [master]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: ждать устаревший смысла нет.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Пин, а не ubuntu-latest: 19.10.26 латест переезжает на Ubuntu 26,
    # а проект сдаётся до 22.12.26. Переезд выберем сами, не посреди лабы.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      # Демо это часть сдачи лабы, поэтому оно не должно сгнить незаметно.
      - name: Run the demo scenario
        run: ./gradlew run --no-daemon --console=plain

      - name: Upload the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
